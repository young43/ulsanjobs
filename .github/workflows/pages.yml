name: Hourly Job Refresh

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests beautifulsoup4

      - run: python collect.py --days 60

      - run: python build_site.py

      - name: Commit and push
        run: |
          git config user.name "UlsanJobs Bot"
          git config user.email "actions@github.com"
          git add data/jobs.json site/ docs/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            JOBS=$(python -c "import json; print(json.load(open('data/jobs.json'))['count'])")
            git commit -m "Update: $(date -u +%Y-%m-%d\ %H:%M) UTC ($JOBS jobs)"
            git push
          fi
